name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Install, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      # *.testnet.test.ts suites hit live Horizon; run them with `npm run test:testnet`.
      - name: Test
        run: npm test -- --ci --testPathIgnorePatterns testnet
